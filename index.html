<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="Herramientas de campo para técnicos instaladores de CCTV" />
  <title>CCTV Field Tools</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📹</text></svg>" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
  <div id="auth-screen" class="auth-screen">
    <div class="auth-card">
      <div class="auth-logo">📹</div>
      <h1>CCTV Field Tools</h1>
      <p class="auth-sub">Herramientas para técnicos instaladores</p>
      <form id="login-form">
        <input type="email" id="auth-email" placeholder="Email" required autocomplete="email" />
        <input type="password" id="auth-password" placeholder="Contraseña" required autocomplete="current-password" />
        <button type="submit" class="btn btn-primary btn-block">Entrar</button>
      </form>
      <button type="button" id="btn-register" class="btn btn-ghost btn-block">Crear cuenta</button>
      <div class="auth-divider"><span>o</span></div>
      <button type="button" id="btn-google" class="btn btn-google btn-block">Continuar con Google</button>
      <p id="auth-msg" class="auth-msg"></p>
    </div>
  </div>
  <div id="app" class="app hidden">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <span class="logo">📹 CCTV Tools</span>
        <button class="btn-icon" id="btn-close-sidebar" aria-label="Cerrar">✕</button>
      </div>
      <nav class="nav">
        <button class="nav-item active" data-view="home">🏠 Inicio</button>
        <button class="nav-item" data-view="subnet">🌐 Subred IP</button>
        <button class="nav-item" data-view="storage">💾 Almacenamiento</button>
        <button class="nav-item" data-view="wiring">🔌 Cableado</button>
        <button class="nav-item" data-view="dvr">📋 Checklist DVR</button>
        <button class="nav-item" data-view="ping">📡 Ping / RTSP</button>
        <button class="nav-item" data-view="install">✅ Instalación</button>
        <button class="nav-item" data-view="history">📂 Historial</button>
      </nav>
      <div class="sidebar-footer">
        <div id="user-info" class="user-info"></div>
        <button class="btn btn-ghost btn-sm" id="btn-logout">Cerrar sesión</button>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <button class="btn-icon" id="btn-menu" aria-label="Menú">☰</button>
        <h2 id="view-title">Inicio</h2>
        <div class="status-badges">
          <span id="badge-mode" class="badge">💾 Local</span>
          <span id="badge-online" class="badge">🟢 Online</span>
          <span id="badge-sync" class="badge hidden">✅ Sync</span>
          <span id="badge-pending" class="badge hidden">⏳ 0</span>
          <span id="badge-conflicts" class="badge hidden">⚡ 0</span>
        </div>
      </header>
      <div class="content" id="content"></div>
    </main>
    <nav class="bottom-nav" id="bottom-nav">
      <button class="bnav-item active" data-view="home">🏠</button>
      <button class="bnav-item" data-view="subnet">🌐</button>
      <button class="bnav-item" data-view="storage">💾</button>
      <button class="bnav-item" data-view="wiring">🔌</button>
      <button class="bnav-item" data-view="history">📂</button>
    </nav>
  </div>
  <div id="conflict-modal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-header">
        <h3>Conflictos resueltos</h3>
        <button class="btn-icon" id="btn-close-conflicts">✕</button>
      </div>
      <div id="conflict-list" class="conflict-list"></div>
      <button class="btn btn-ghost btn-sm" id="btn-clear-conflicts">Limpiar log</button>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/tools.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
